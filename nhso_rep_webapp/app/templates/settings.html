<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งค่า | NHSO REP Download Manager</title>
  <link href="{{ url_for('static', path='/vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', path='/css/app.css') }}" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="container-fluid app-container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark"><i data-lucide="file-down"></i></span>
        <span><strong>NHSO REP</strong><small>Download Manager</small></span>
      </a>
      <nav class="header-nav" aria-label="เมนูหลัก">
        <a href="/">ดาวน์โหลด</a>
        <a href="/history">ประวัติ</a>
        <a class="is-active" href="/settings">ตั้งค่า</a>
      </nav>
      <span class="header-context">Web App</span>
    </div>
  </header>

  <main>
    <section class="title-band">
      <div class="container-fluid app-container title-inner">
        <div><p class="section-kicker">การตั้งค่า</p><h1>ค่าเริ่มต้นของ Web App</h1></div>
      </div>
    </section>

    <section class="workspace-band">
      <div class="container-fluid app-container settings-layout">
        <form id="settingsForm" class="settings-form" novalidate>
          <div>
            <label class="form-label" for="defaultDestination">โฟลเดอร์ปลายทางเริ่มต้น</label>
            <div class="input-icon-wrap">
              <i data-lucide="folder"></i>
              <input class="form-control" id="defaultDestination" type="text" required maxlength="1024">
            </div>
          </div>
          <div>
            <label class="form-label" for="defaultPageSize">Page size</label>
            <input class="form-control" id="defaultPageSize" type="number" min="1" max="10000" required>
          </div>
          <div class="option-row">
            <div class="form-check form-switch">
              <input class="form-check-input" id="defaultInsecure" type="checkbox" role="switch">
              <label class="form-check-label" for="defaultInsecure">ปิดการตรวจสอบ SSL certificate เป็นค่าเริ่มต้น</label>
            </div>
          </div>
          <div id="settingsAlert" class="form-alert" role="alert" hidden></div>
          <div class="settings-actions">
            <button class="btn btn-primary" type="submit"><i data-lucide="save"></i><span>บันทึก</span></button>
          </div>
        </form>
        <aside class="settings-meta">
          <div class="detail-row"><span>Legacy settings</span><strong>ไม่ถูกแก้ไข</strong></div>
          <div class="detail-row"><span>SSO token</span><strong>Windows DPAPI</strong></div>
          <div class="detail-row"><span>Network binding</span><strong>127.0.0.1</strong></div>
          <div class="automation-action">
            <span>เดือนก่อน</span>
            <button id="previousMonthDryRun" class="btn btn-outline-primary" type="button">
              <i data-lucide="calendar-search"></i><span>ตรวจสอบแบบ Dry Run</span>
            </button>
            <small id="automationResult"></small>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', path='/vendor/lucide/lucide.min.js') }}"></script>
  <script src="{{ url_for('static', path='/js/settings.js') }}"></script>
</body>
</html>
